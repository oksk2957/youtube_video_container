services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video_dev_password
      POSTGRES_DB: video_studio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video_studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: videostudio
      MINIO_ROOT_PASSWORD: videostudio_dev_secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 videostudio videostudio_dev_secret; do sleep 2; done;
      mc mb --ignore-existing local/video-studio;
      exit 0;
      '

  ai-worker:
    profiles: ["ai"]
    build: ./worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://video:video_dev_password@postgres:5432/video_studio?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: video-studio
      S3_ACCESS_KEY_ID: videostudio
      S3_SECRET_ACCESS_KEY: videostudio_dev_secret
      S3_FORCE_PATH_STYLE: "true"
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.openai.com}
      AI_ALLOW_LOCAL_HTTP: ${AI_ALLOW_LOCAL_HTTP:-false}
      HF_HOME: /models
    volumes:
      - whispermodels:/models

volumes:
  pgdata:
  miniodata:
  whispermodels:
