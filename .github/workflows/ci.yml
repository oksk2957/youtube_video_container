name: One-shot local editor checks

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend
      - name: API, planner, and synthetic MP4 rendering tests
        run: python -m unittest discover -s backend/tests -v
      - name: Verify live one-shot web and API on ports 3000 and 8100
        run: |
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8100 --no-access-log > /tmp/oneshot-api.log 2>&1 &
          API_PID=$!
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/oneshot-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true; cat /tmp/oneshot-api.log; cat /tmp/oneshot-web.log' EXIT
          python scripts/verify_running_editor.py

