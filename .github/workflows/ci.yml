name: Video Studio CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
          POSTGRES_DB: video_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U video -d video_studio'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://video:video@localhost:5432/video_studio?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript packages
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://video:video@localhost:5432/video_studio?schema=public
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Timeline unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://video:video@localhost:5432/video_studio?schema=public
      - name: Typecheck
        run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile Python worker
        run: python -m compileall -q worker/
      - name: Python worker unit tests and synthetic FFmpeg render
        run: python -m unittest discover -s worker/tests -v
